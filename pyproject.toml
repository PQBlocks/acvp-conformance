[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-acvp"
version = "0.1.0"
description = "Cross-implementation NIST ACVP and FIPS 203/204/205 post-quantum cryptography conformance harness."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["post-quantum", "pqc", "acvp", "fips-203", "fips-204", "fips-205", "ml-kem", "ml-dsa", "conformance-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["dilithium_py", "kyber_py"]

[project.optional-dependencies]
test = ["pytest", "cryptography>=41.0.0"]

[project.urls]
Homepage = "https://github.com/PQBlocks/acvp-conformance"
Documentation = "https://github.com/PQBlocks/acvp-conformance#readme"
Source = "https://github.com/PQBlocks/acvp-conformance"
Changelog = "https://github.com/PQBlocks/acvp-conformance/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/acvp-conformance/issues"
Security = "https://github.com/PQBlocks/acvp-conformance/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
